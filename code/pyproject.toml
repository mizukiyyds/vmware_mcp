[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vmware-mcp"
version = "0.3.0"
description = "MCP server: manage local VMware Workstation 26H1 VMs via vmrun and vmcli"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0"]

[project.scripts]
vmware-mcp = "vmware_mcp.server:main"

[tool.setuptools]
packages = ["vmware_mcp"]
